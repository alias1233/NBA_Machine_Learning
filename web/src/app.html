<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Declared before any stylesheet arrives, so the browser paints its canvas in the reader's
		     theme rather than white. -->
		<meta name="color-scheme" content="light dark" />

		<!-- Placeholder mark. It is replaced once the site has a name and an identity. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- All three faces are self-hosted, Latin only, and preloaded so text is not swapped late. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/inter-tight-latin.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/instrument-serif-latin.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin.woff2"
			crossorigin
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
