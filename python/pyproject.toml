[project]
name = "nba-ml"
version = "0.1.0"
description = "Collects NBA data, builds features from it, trains models, and predicts NBA statistics."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "python-dateutil>=2.9.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.13.0",
    "torch>=2.4.0",

    "requests>=2.32.3",
    "python-dotenv>=1.0",
    "nba_api>=1.11.4",

    "fastapi[standard]>=0.141.1,<0.142.0",
    "pydantic>=2.0",

    # Windows ships no time zone database, and a game date is a United States eastern date.
    "tzdata>=2024.1",
]

# Only training and the notebooks need these, and neither runs on the server, so the deployed image
# is built with --no-dev and never installs them.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyter>=1.1.1",
    "matplotlib",
]

# The server has no graphics card and the CUDA build of torch is gigabytes of it. Linux is the
# server, so only Linux takes the processor-only wheel. Every other platform resolves as before.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
nba-collect = "nba_ml.cli.collect:main"
nba-import-legacy = "nba_ml.cli.import_legacy:main"
nba-schedule = "nba_ml.cli.schedule:main"
nba-build-features = "nba_ml.cli.build_features:main"
nba-train = "nba_ml.cli.train:main"
nba-predict = "nba_ml.cli.predict:main"
nba-backup = "nba_ml.cli.backup:main"
nba-update-serving = "nba_ml.cli.update_serving:main"
nba-serving-data = "nba_ml.cli.serving_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
